[package]
name = "jterm"
version = "0.1.0"
edition = "2021"
description = "A small, fast terminal for Linux, with splits and workspaces"
license = "MIT"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
fontdue = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "std"] }
# The clipboard, on X11 and on Wayland.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rustybuzz = "0.20"
ttf-parser = "0.25"
ab_glyph_rasterizer = "0.1"

[build-dependencies]
vergen-gitcl = "10.0.3"
# Only to make src/ghostty_sys.rs again from libghostty-vt's headers,
# which needs libclang; the build uses the file as it is.
bindgen = { version = "0.72", optional = true }

[features]
bindgen = ["dep:bindgen"]

# As jog and hotshot have it: no cross-crate LTO, Cargo's own 16 codegen
# units, for rebuilds in seconds.
[profile.release]
opt-level = 3
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3
