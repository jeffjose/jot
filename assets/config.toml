# jterm: settings.
#
# Nothing here is set until you take the # off the front of a line. Each
# setting is shown with its usual value. Settings (Ctrl ,) writes the
# ones it changes here too.

# ---- Look -----------------------------------------------------------

# The colors, by name:
#   Dark 2026  Light 2026  Dark Modern  Light Modern  Catppuccin Mocha
#   Catppuccin Latte
#   Tokyo Night  Dracula  One Dark  GitHub Dark  Nord  Gruvbox Dark
#   Gruvbox Light  Solarized Dark  Solarized Light  Rosé Pine  Kanagawa
#   Monokai
# theme = "Dark 2026"

# The size of the terminal's text, in points (Ctrl = and Ctrl - change it
# for this run).
# font-size = 14

# The color of what is picked out: the pane you are in, menus,
# switches. A Radix color by name, or any color as "RRGGBB":
#   indigo  blue  iris  violet  purple  plum  pink  crimson  ruby  red
#   tomato  orange  amber  gold  brown  grass  green  jade  teal  cyan
# accent = "indigo"

# The terminal's font, by family, and the font of jterm's own words.
# font-family = "Fira Code"
# ui-font-family = "Geist"
# ui-font-size = 13

# Text is made darker or lighter until it has this much contrast with
# its ground, as VS Code's terminal does (its 4.5), so a prompt made for
# a dark theme can still be read on a light one. 1 leaves colors alone.
# min-contrast = 4.5

# The height of a line, as a share of the font's own: 1.1 is VS Code's.
# line-height = 1.1

# A caption along the bottom of each pane: its title, in the accent for the one
# you are in.
# captions = true

# Characters joined as the font draws them: => and != in Fira Code.
# ligatures = true

# A bar beside each command and its output, green or red by how it
# ended, with its time when it failed or was slow (shell integration).
# command-bars = false

# Workspaces without an accent of their own each get a different one;
# the first keeps the accent above.
# workspace-colors = true

# A status line along the bottom of the window: host, workspaces, clock.
# status-line = false

# The last session, when jterm starts: "ask" opens fresh with a card at
# the top right to bring it back (typing begins fresh); "always" brings
# it back; "never" does not.
# restore = "ask"

# What puts frames on the screen: "gpu", through Vulkan or OpenGL on
# NVIDIA, AMD or Intel alike, with the CPU when there is no GPU to use;
# or "cpu". jterm --debug says which it is using.
# renderer = "gpu"

# Lines kept above the screen, in each pane.
# scrollback = 40960

# Folders whose folders are projects, for the palette to open.
# projects = ["~/scripts", "~/code", "~/src", "~/projects", "~/dev"]

# ---- Workspaces -----------------------------------------------------
#
# The workspaces jterm starts with when it has none saved. After that it
# brings back the workspaces as you left them (in
# ~/.local/state/jterm/session.toml); start it with --fresh to begin
# from these again.
#
# A workspace has a folder its panes start in, and its panes: each the
# command it runs, "" for your shell. Laid out side by side:
#
# [[workspace]]
# name = "jterm"
# cwd = "~/scripts/jterm"
# panes = ["claude", "claude", ""]
#
# or one above another, with split = "h":
#
# [[workspace]]
# name = "notes"
# cwd = "~/notes"
# panes = ["", ""]
# split = "h"
#
# Any mix of the two is a layout: v for side by side, h for stacked,
# nested as deep as you like, with each part's share if not equal.
#
# [[workspace]]
# name = "hotshot"
# cwd = "~/scripts/hotshot"
# layout = { v = [ { h = ["claude", "claude"] }, "", "" ], sizes = [2, 1, 1] }
#
# A workspace can run commands when it opens and each time you go to it,
# in its folder:
#
# [[workspace]]
# name = "jog"
# cwd = "~/scripts/jog"
# on-open = "git fetch -q"
# on-focus = "notify-send jog here"

# ---- Triggers -------------------------------------------------------
#
# A pattern looked for in what every pane prints, and what to do when a
# line has it: notify (a desktop notice, the default), open (the link on
# the line), or run (a command, with the line in $JTERM_MATCH and the
# pane, as 1.2, in $JTERM_PANE).
#
# [[trigger]]
# match = "error\\[E[0-9]+\\]|panicked at"
# action = "notify"
#
# [[trigger]]
# match = "Local: +http://localhost:[0-9]+"
# action = "open"
