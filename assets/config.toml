# jterm: settings.
#
# Nothing here is set until you take the # off the front of a line. Each
# setting is shown with its usual value. Settings (Ctrl ,) writes the
# ones it changes here too.

# ---- Look -----------------------------------------------------------

# The colours, by name:
#   Dark 2026  Light 2026  Dark Modern  Light Modern  Catppuccin Mocha
#   Catppuccin Latte
#   Tokyo Night  Dracula  One Dark  GitHub Dark  Nord  Gruvbox Dark
#   Gruvbox Light  Solarized Dark  Solarized Light  Rosé Pine  Kanagawa
#   Monokai
# theme = "Dark 2026"

# The size of the terminal's text, in points (Ctrl = and Ctrl - change it
# for this run).
# font-size = 14

# The colour of what is picked out: the pane you are in, menus,
# switches. A Radix colour by name, or any colour as "RRGGBB":
#   indigo  blue  iris  violet  purple  plum  pink  crimson  ruby  red
#   tomato  orange  amber  gold  brown  grass  green  jade  teal  cyan
# accent = "indigo"

# The terminal's font, by family, and the font of jterm's own words.
# font-family = "Fira Code"
# ui-font-family = "Geist"
# ui-font-size = 13

# Text is made darker or lighter until it has this much contrast with
# its ground, as VS Code's terminal does (its 4.5), so a prompt made for
# a dark theme can still be read on a light one. 1 leaves colours alone.
# min-contrast = 4.5

# The height of a line, as a share of the font's own: 1.1 is VS Code's.
# line-height = 1.1

# A caption along the bottom of each pane: its title, in the accent for the one
# you are in.
# captions = true

# Characters joined as the font draws them: => and != in Fira Code.
# ligatures = true

# A status line along the bottom of the window: host, workspaces, clock.
# status-line = false

# Lines kept above the screen, in each pane.
# scrollback = 40960

# Folders whose folders are projects, for the palette to open.
# projects = ["~/scripts", "~/code", "~/src", "~/projects", "~/dev"]

# ---- Workspaces -----------------------------------------------------
#
# The workspaces jterm starts with when it has none saved. After that it
# brings back the workspaces as you left them (in
# ~/.local/state/jterm/session.toml); start it with --fresh to begin
# from these again.
#
# A workspace has a folder its panes start in, and its panes: each the
# command it runs, "" for your shell. Laid out side by side:
#
# [[workspace]]
# name = "jterm"
# cwd = "~/scripts/jterm"
# panes = ["claude", "claude", ""]
#
# or one above another, with split = "h":
#
# [[workspace]]
# name = "notes"
# cwd = "~/notes"
# panes = ["", ""]
# split = "h"
#
# Any mix of the two is a layout: v for side by side, h for stacked,
# nested as deep as you like, with each part's share if not equal.
#
# [[workspace]]
# name = "hotshot"
# cwd = "~/scripts/hotshot"
# layout = { v = [ { h = ["claude", "claude"] }, "", "" ], sizes = [2, 1, 1] }
